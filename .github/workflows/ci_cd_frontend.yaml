name: CI/CD - Frontend

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "credit-pulse/frontend/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - victor/ci-cd-pipelines # testing purpose - remove me before merging

permissions:
  id-token: write
  contents: read

concurrency:
  group: credit-pulse-frontend
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace=credit-pulse/frontend

      - name: Create .env.production file
        working-directory: credit-pulse/frontend
        run: |
          echo "${{ secrets.NEXT_ENV_FILE }}" > .env.production

      - name: Build Next.js
        run: npm run build:frontend
        env:
          NODE_ENV: production

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-Deploy

      - name: Sync files to S3
        working-directory: credit-pulse/frontend/out
        run: aws s3 sync . s3://${{ vars.AWS_S3_BUCKET_NAME }} --delete
