name: Code Validations - Backend

on:
  pull_request:

jobs:
  lint:
    name: Lint - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: NPM Install
        run: |
          npm install

      - name: Run Linting
        run: |
          npm run lint:backend

  format:
    name: Format - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: NPM Install
        run: |
          npm install

      - name: Run Formatting
        run: |
          npm run format:backend
          git diff --exit-code

  test:
    name: Test - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: NPM Install
        run: |
          npm install

      - name: Run Tests
        run: |
          npm run test:backend
