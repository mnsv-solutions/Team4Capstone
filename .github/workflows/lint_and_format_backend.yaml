name: Lint and Format Validation - Backend

on:
  pull_request:
    paths:
      - "credit-pulse/backend/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: NPM Install
        run: |
          npm install

      - name: Run Linting
        run: |
          npm run lint:backend

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: NPM Install
        run: |
          npm install

      - name: Run Formatting
        run: |
          npm run format:backend
          git diff --exit-code
